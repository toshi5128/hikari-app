<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>ひかり不動産｜物件資料</title>
<style>body{font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;background:#f1f0ec;color:#1c1a17;margin:0;padding:40px 20px;text-align:center}a{display:inline-block;margin-top:16px;padding:14px 22px;background:#a8842f;color:#fff;border-radius:12px;text-decoration:none;font-weight:700}</style>
</head>
<body>
<p id="m">資料を開いています…</p>
<script>
// SMS用の短いリンク（d.html?<物件id36進>.<時刻36進>.<乱数>.<拡張子>）を、アプリの資料置き場のファイルへ転送する。
// 置き場の docs/ 以外へは飛ばさない（どこへでも飛べる転送ページにしない）。
(function () {
  var c = location.search.slice(1), m = /^([0-9a-z]{1,12})\.([0-9a-z]{1,12})\.([0-9a-z]{1,12})\.(pdf|jpg|jpeg|png|webp|heic|gif)$/.exec(c);
  if (!m) { document.getElementById("m").textContent = "リンクが正しくありません。お手数ですが担当者にご連絡ください。"; return; }
  var url = "https://ckcykbvislsjwvkizkqc.supabase.co/storage/v1/object/public/hikari-photos/docs/"
    + parseInt(m[1], 36) + "/" + parseInt(m[2], 36) + "_" + m[3] + "." + m[4];
  document.getElementById("m").innerHTML = '資料を開いています…<br><a href="' + url + '">開かない時はこちら</a>';
  location.replace(url);
})();
</script>
</body>
</html>
